name: pausecart
description: PauseCart — a waiting shelf for things you are not buying yet.

publish_to: "none"

version: 1.0.1+1

environment:
  sdk: ">=3.4.3 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.6
  provider: ^6.1.5
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  in_app_purchase: ^3.2.1
  http: ^1.2.2
  intl: ^0.20.2
  uuid: ^4.5.1
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  wakelock_plus: ^1.2.8
  characters: ^1.3.0
  google_mobile_ads: ^5.3.1
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4
  flutter_timezone: 3.0.1
  receive_sharing_intent: ^1.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/logo.png
  adaptive_icon_background: "#F7F4EF"
  adaptive_icon_foreground: assets/logo.png
  adaptive_icon_foreground_inset: 0
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Variable.ttf
    - family: Archivo
      fonts:
        - asset: assets/fonts/Archivo-Variable.ttf
